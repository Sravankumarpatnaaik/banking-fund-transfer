apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-bank
  namespace: meridian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-bank
  template:
    metadata:
      labels:
        app: meridian-bank
    spec:
      containers:
        - name: bank
          image: docker.io/YOUR_DOCKERHUB_ID/meridian-bank:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meridian-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
