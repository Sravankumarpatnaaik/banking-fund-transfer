---
- name: Build the Meridian Bank image and push it to Docker Hub
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    image_tag: "1.0.0"

  tasks:
    - name: Require Docker Hub credentials
      ansible.builtin.assert:
        that:
          - dockerhub_username is defined
          - dockerhub_username | length > 0
          - dockerhub_password is defined
          - dockerhub_password | length > 0
        fail_msg: >-
          Pass -e dockerhub_username=YOUR_ID -e dockerhub_password=YOUR_TOKEN.
          Do not commit the token.

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Build and push meridian-bank
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/meridian-bank"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ playbook_dir }}/.."
        push: true
        force_source: true
